name: check & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install Pillow==12.2.0
      - run: npm run check
      # С 11.11 (ТЗ-локальная-версия) игра Шэфа живёт только на его маке (`npm run local`). На Pages — только персональные
      # версии из deploy/editions.json; в корень сайта — пустая страница и sw.js, который снимает старый service worker игры.
      - run: rm -rf dist && mkdir dist && cp -R deploy/root/. dist/
      - run: deploy/build_editions.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
