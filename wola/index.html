<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1c2c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wola" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>Wola · Pierogi i Przypadki</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1c2c; overflow: hidden; overscroll-behavior: none; }
      body { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #game { position: fixed; inset: 0; }
      #overlay {
        position: fixed; inset: 0; pointer-events: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #f4f4f4;
      }
      /* Как в основной игре (P-12): нулевая специфичность, класс с pointer-events: none побеждает. */
      :where(#overlay > *) { pointer-events: auto; }
      /* W-04: пиксельный загрузчик вместо тёмного экрана, пока грузится игра (убирает src/wola/main.ts). */
      #wl-boot { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
        background: #1a1c2c; color: #b8dce5; font: 700 18px ui-monospace, Menlo, monospace; }
      #wl-boot b { color: #ffd966; font-size: 28px; letter-spacing: 2px; }
      #wl-boot .blocks { display: flex; gap: 5px; }
      #wl-boot .blocks i { width: 14px; height: 14px; background: #345a52; box-shadow: inset 0 0 0 2px #141b1b; animation: wl-boot 1s steps(1) infinite; }
      #wl-boot .blocks i:nth-child(2) { animation-delay: .2s; } #wl-boot .blocks i:nth-child(3) { animation-delay: .4s; }
      #wl-boot .blocks i:nth-child(4) { animation-delay: .6s; } #wl-boot .blocks i:nth-child(5) { animation-delay: .8s; }
      @keyframes wl-boot { 0% { background: #74a334; } 50% { background: #345a52; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="overlay"></div>
    <div id="wl-boot" role="status"><b>Wola</b><span class="blocks"><i></i><i></i><i></i><i></i><i></i></span><small>район Воля · загружаю</small></div>
    <script type="module" src="/src/wola/main.ts"></script>
  </body>
</html>
